name: Clarity original-provider map
on:
  push:
    branches: [preview/clarity-assets-20260920]
    paths: [.github/workflows/clarity-osm.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch nine map overview tiles from original site provider
        run: |
          mkdir -p map
          python3 - <<'PY'
          import pathlib, urllib.request, time, json
          out=pathlib.Path('map');rows=[]
          for x in range(923,926):
            for y in range(627,630):
              u=f'https://tile.openstreetmap.org/10/{x}/{y}.png'
              req=urllib.request.Request(u,headers={'User-Agent':'JamieFitness-offline-review/1.0 (+https://jamiefitness.au)','Referer':'https://jamiefitness.au/'})
              with urllib.request.urlopen(req,timeout=20) as r: b=r.read()
              if b[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('Expected PNG')
              (out/f'{x}-{y}.png').write_bytes(b);rows.append({'x':x,'y':y,'url':u});time.sleep(1)
          (out/'metadata.json').write_text(json.dumps({'zoom':10,'x0':923,'y0':627,'cols':3,'rows':3,'tilePixels':256,'attribution':'© OpenStreetMap contributors','tiles':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clarity-osm-map
          path: map/
          retention-days: 3
