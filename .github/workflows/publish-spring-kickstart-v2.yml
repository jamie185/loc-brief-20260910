name: Publish isolated Spring Kickstart V2
on:
  push:
    branches: [main]
    paths: ['_spring-kickstart-v2/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: spring-kickstart-v2-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Transfer and validate the exact standalone HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const m = JSON.parse(fs.readFileSync('_spring-kickstart-v2/manifest.json', 'utf8'));
            if (m.codec !== 'https-sha256' || m.bytes !== 990016 || m.sha256 !== '36b0fa1e51962d14b95d87ee69b6fef314abd7ebbc81644b4b29b082ea901065') throw Error('Unexpected source manifest');
            const url = new URL(m.source_url);
            if (url.protocol !== 'https:' || url.hostname !== 'sdmntprnznorth.oaiusercontent.com') throw Error('Unexpected transfer host');
            console.log('::add-mask::' + m.source_url);
            const response = await fetch(url, {signal: AbortSignal.timeout(90000), redirect: 'error'});
            if (!response.ok) throw Error('Transfer failed: HTTP ' + response.status);
            const html = Buffer.from(await response.arrayBuffer());
            const digest = crypto.createHash('sha256').update(html).digest('hex');
            if (html.length !== m.bytes || digest !== m.sha256) throw Error('Checksum mismatch; refusing to publish');
            if (!html.toString('utf8').includes('noindex,nofollow,noarchive')) throw Error('Noindex protection missing');
            fs.mkdirSync('spring-kickstart-v2', {recursive: true});
            fs.writeFileSync('spring-kickstart-v2/index.html', html);
            console.log('Verified:', html.length, 'bytes; SHA256:', digest);
          })().catch(error => {console.error(error.message); process.exit(1);});
          NODE
      - name: Commit only the isolated page
        shell: bash
        run: |
          git add -- spring-kickstart-v2/index.html
          if git diff --cached --quiet; then
            echo 'Published content already matches.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = 'spring-kickstart-v2/index.html'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish checksum-verified Spring Kickstart V2 in isolated folder'
          git push origin HEAD:main
      - name: Request rebuild of the already enabled Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
