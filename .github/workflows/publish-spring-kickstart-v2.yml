name: Verify Spring Kickstart V2 publication
on:
  push:
    branches: [main]
    paths:
      - 'spring-kickstart-v2/**'
      - '.github/workflows/publish-spring-kickstart-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spring-kickstart-v2-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public URL matches the committed HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          (async () => {
            const local = fs.readFileSync('spring-kickstart-v2/index.html');
            const expected = hash(local);
            const url = 'https://jamie185.github.io/loc-brief-20260910/spring-kickstart-v2/';
            let verified = false;
            for (let attempt = 1; attempt <= 24; attempt++) {
              try {
                const response = await fetch(url + '?verify=' + expected.slice(0, 12) + '-' + attempt, {signal: AbortSignal.timeout(12000)});
                const body = Buffer.from(await response.arrayBuffer());
                const actual = hash(body);
                console.log('Attempt', attempt, 'HTTP', response.status, 'bytes', body.length, 'SHA256', actual);
                if (response.ok && actual === expected && /text\/html/i.test(response.headers.get('content-type') || '')) {
                  verified = true;
                  console.log('PUBLICATION VERIFIED:', url);
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Published and verified\n\n' + url + '\n\nHTTP 200. Full HTML matches the committed file.\n\nSHA256: `' + expected + '`\n');
                  break;
                }
              } catch (error) { console.log('Still waiting:', error.message); }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!verified) throw Error('Public Pages URL did not match the committed HTML within the verification window.');
          })().catch(error => {console.error(error.message); process.exit(1);});
          NODE
