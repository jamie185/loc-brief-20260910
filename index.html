<style>
  :root {
    --ink: #171a1f;
    --paper: #f4f5f7;
    --mute: #66707c;
    --line: #e2e5ea;
    --snap: #c8102e;
    --film: #0e1114;
    --go: #1f7a4d;
    --hold: #8a6414;
    --no: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", sans-serif;
    font-size: 18px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--snap);
    outline-offset: 2px;
  }
  button { font: inherit; }

  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(280px, 44%) 1fr;
    overflow: hidden;
  }

  .shots {
    position: relative;
    background: #111;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .hero-wrap {
    position: relative;
    flex: 1;
    min-height: 180px;
  }
  .hero-stack {
    position: absolute;
    inset: 0;
  }
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    pointer-events: none;
  }
  .hero.on {
    opacity: 1;
    pointer-events: auto;
  }
  .thumbs {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    z-index: 2;
  }
  .thumbs button {
    padding: 0;
    border: 2px solid rgba(255,255,255,.45);
    background: #222;
    cursor: pointer;
    height: 58px;
  }
  .thumbs button.on { border-color: #fff; }
  .thumbs img {
    width: 100%;
    height: 54px;
    object-fit: cover;
    display: block;
  }

  .copy {
    min-width: 0;
    overflow: auto;
    padding: 22px 40px 18px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 28px;
    color: var(--mute);
    font-size: 13px;
  }
  .top strong {
    color: var(--ink);
    font-family: Syne, sans-serif;
    font-size: 14px;
    font-weight: 700;
  }

  .flag {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 700;
  }
  .flag.go { color: var(--snap); }
  .flag.hold { color: var(--hold); }
  .flag.no { color: var(--no); }
  .club {
    font-family: Syne, sans-serif;
    font-size: 56px;
    font-weight: 800;
    line-height: 0.88;
    letter-spacing: -0.03em;
    margin: 0 0 10px;
  }
  .where { margin: 0 0 16px; color: var(--mute); font-size: 16px; }
  .why {
    margin: 0 0 22px;
    max-width: 38ch;
    font-size: 18px;
    line-height: 1.5;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px 18px;
    margin: 0 0 8px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stats b {
    display: block;
    font-family: Syne, sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .stats span { color: var(--mute); font-size: 13px; }
  .go { color: var(--go); }
  .hold { color: var(--hold); }
  .no { color: var(--no); }
  .more { margin: 10px 0 22px; color: var(--mute); font-size: 14px; max-width: 52ch; }

  .phone {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    background: var(--snap);
    color: #fff;
    text-decoration: none;
    font-family: Syne, sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.01em;
    padding: 14px 22px;
    margin: 0 0 14px;
    width: max-content;
  }
  .phone:hover { background: #a80d26; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 22px; font-size: 15px; }
  .links a { color: var(--mute); }
  .links a:hover { color: var(--ink); }

  .faces { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
  .face { width: 148px; }
  .face img {
    width: 148px;
    height: 176px;
    object-fit: cover;
    object-position: top;
    display: block;
    background: #ddd;
  }
  .face b { display: block; font-size: 16px; margin-top: 8px; font-weight: 700; }
  .face span { display: block; font-size: 13px; color: var(--mute); }

  .map-wrap {
    flex: 0 0 230px;
    height: 230px;
    position: relative;
    z-index: 1;
  }
  .map {
    height: 100%;
    background: #d9dee4;
  }
  .map-label {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 500;
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 10px;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  .ig-pop {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    width: min(420px, 92vw);
    height: calc(100vh - 160px);
    background: #fff;
    border: 1px solid var(--line);
    z-index: 20;
    flex-direction: column;
  }
  .ig-pop.on { display: flex; }
  .ig-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .ig-bar button, .ig-bar a {
    border: 0;
    background: transparent;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .ig-pop iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #fafafa;
  }

  .dock {
    background: var(--film);
    color: #fff;
    flex: 0 0 auto;
    position: sticky;
    bottom: 0;
    z-index: 6;
  }
  .dock-row {
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    align-items: stretch;
  }
  .arrow {
    width: 48px;
    background: transparent;
    color: #fff;
    border: 0;
    cursor: pointer;
    font-size: 32px;
    line-height: 1;
  }
  .arrow:hover { background: #1a1e24; }
  .strip {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 3px;
  }
  .chip {
    appearance: none;
    position: relative;
    border: 0;
    padding: 0;
    cursor: pointer;
    height: 112px;
    overflow: hidden;
    background: #000;
    text-align: left;
    color: #fff;
  }
  .chip img {
    width: 100%;
    height: 112px;
    object-fit: cover;
    display: block;
    filter: brightness(0.38);
  }
  .chip.on img { filter: brightness(1); }
  .chip span {
    position: absolute;
    left: 10px;
    right: 8px;
    bottom: 8px;
    z-index: 1;
    font-family: Syne, sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.1;
    text-shadow: 0 1px 10px rgba(0,0,0,.85);
  }
  .chip small {
    display: block;
    font-family: "Atkinson Hyperlegible", sans-serif;
    font-size: 11px;
    font-weight: 400;
    margin-top: 3px;
    opacity: 0.9;
  }
  .chip.on { box-shadow: inset 0 3px 0 var(--snap); }
  .hint {
    color: #8b9198;
    font-size: 12px;
    margin: 0;
    padding: 8px 16px 10px;
  }

  @media (max-width: 900px) {
    body { height: auto; }
    .stage { display: block; overflow: visible; }
    .shots { height: auto; }
    .hero-wrap { height: 240px; }
    .map-wrap { height: 220px; flex-basis: 220px; }
    .copy { padding: 20px 18px 24px; }
    .club { font-size: 42px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .strip { grid-template-columns: repeat(8, 140px); overflow-x: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero, .chip img { filter: none; }
    .hero { transition: none; }
  }
</style>

let i = 0;
let photo = 0;
const HOME = { lat: -33.9500347, lng: 150.86584, name: "Prestons" };
const routes = {};
let map, homeMark, gymMark, driveLine;

function bigPhoto(src) {
  return src.replace(/w=\d+/, "w=720");
}
function thumbPhoto(src) {
  return src.replace(/w=\d+/, "w=240");
}
function preloadClub(c) {
  c.photos.forEach(function (src) {
    const im = new Image();
    im.src = bigPhoto(src);
  });
  c.team.forEach(function (t) {
    const im = new Image();
    im.src = t[2];
  });
}
function loadRoute(c) {
  const url = "https://router.project-osrm.org/route/v1/driving/" +
    HOME.lng + "," + HOME.lat + ";" + c.lng + "," + c.lat +
    "?overview=full&geometries=geojson";
  return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    const geom = j.routes && j.routes[0] && j.routes[0].geometry;
    if (geom && geom.coordinates) {
      routes[c.id] = geom.coordinates.map(function (p) { return [p[1], p[0]]; });
    }
  }).catch(function () {});
}

function initMap() {
  map = L.map("map", { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
  homeMark = L.circleMarker([HOME.lat, HOME.lng], {
    radius: 8, color: "#171a1f", fillColor: "#171a1f", fillOpacity: 1, weight: 2
  }).addTo(map).bindTooltip("Prestons, trainer", { permanent: false });
  gymMark = L.circleMarker([clubs[0].lat, clubs[0].lng], {
    radius: 9, color: "#c8102e", fillColor: "#c8102e", fillOpacity: 1, weight: 2
  }).addTo(map);
  driveLine = L.polyline([[HOME.lat, HOME.lng], [clubs[0].lat, clubs[0].lng]], {
    color: "#c8102e", weight: 4, opacity: 0.9
  }).addTo(map);
  setTimeout(function () { map.invalidateSize(); }, 80);
}

function updateMap(c) {
  if (!map) return;
  gymMark.setLatLng([c.lat, c.lng]);
  gymMark.bindTooltip(c.name, { permanent: false });
  const pts = routes[c.id] || [[HOME.lat, HOME.lng], [c.lat, c.lng]];
  driveLine.setLatLngs(pts);
  map.fitBounds(L.latLngBounds(pts.concat([[HOME.lat, HOME.lng]])), { padding: [28, 28], maxZoom: 13 });
  document.getElementById("mapLabel").textContent =
    "Prestons to " + c.name + ": " + c.drive + ", " + c.km + " drive";
  setTimeout(function () { map.invalidateSize(); }, 40);
}

function show(n, keepPhoto) {
  i = (n + clubs.length) % clubs.length;
  const c = clubs[i];
  if (!keepPhoto) photo = 0;
  document.getElementById("flag").className = "flag " + c.tone;
  document.getElementById("flag").textContent = c.rank + " of 8. " + c.flag;
  document.getElementById("name").textContent = c.name;
  document.getElementById("where").textContent = c.addr + ". " + c.drive + " from Prestons, " + c.km + ".";
  document.getElementById("why").textContent = c.why;
  document.getElementById("stats").innerHTML =
    '<div><span>Spend</span><b class="' + c.tone + '">' + c.spend + "</b></div>" +
    "<div><span>Drive</span><b>" + c.drive + "</b></div>" +
    "<div><span>PTs on the floor</span><b>" + c.pts + "</b></div>" +
    "<div><span>Members</span><b>" + c.members.replace("~", "") + "</b></div>";
  document.getElementById("more").textContent =
    c.likeMelb + " Master " + c.master + ". Fit-out " + c.fit + ". " + c.sqm + " sqm. Household " + c.hh + ". Reviews " + c.reviews + ".";
  const phone = document.getElementById("phone");
  phone.href = "tel:" + c.tel;
  phone.textContent = "Call " + c.phone;
  document.getElementById("links").innerHTML =
    '<a href="mailto:' + c.email + '">' + c.email + "</a>" +
    '<a href="' + c.web + '" target="_blank" rel="noopener">Club website</a>' +
    '<a href="' + c.ig + '" target="_blank" rel="noopener" id="igLink">Instagram</a>' +
    '<a href="' + c.hub + '" target="_blank" rel="noopener">HubSpot</a>';
  document.getElementById("igLink").addEventListener("click", function (e) {
    e.preventDefault();
    openIg(c);
  });
  document.getElementById("faces").innerHTML = c.team.map(function (t) {
    return '<div class="face"><img src="' + t[2] + '" alt="" onerror="this.style.background=\'#d7dbe0\';this.removeAttribute(\'src\')"><b>' + t[0] + "</b><span>" + t[1] + "</span></div>";
  }).join("");
  paintPhotos(c, photo);
  document.querySelectorAll(".chip").forEach(function (el, idx) {
    el.classList.toggle("on", idx === i);
  });
  if (location.hash !== "#" + c.id) history.replaceState(null, "", "#" + c.id);
  updateMap(c);
  preloadClub(clubs[(i + 1) % clubs.length]);
}

function paintPhotos(c, p) {
  photo = p;
  const stack = document.getElementById("heroStack");
  if (stack.dataset.club !== c.id) {
    stack.dataset.club = c.id;
    stack.innerHTML = c.photos.map(function (src, idx) {
      return '<img class="hero' + (idx === p ? " on" : "") + '" src="' + bigPhoto(src) + '" alt="' + c.name + ' gym">';
    }).join("");
    document.getElementById("thumbs").innerHTML = c.photos.map(function (src, idx) {
      return '<button type="button" class="' + (idx === p ? "on" : "") + '" data-p="' + idx + '"><img src="' + thumbPhoto(src) + '" alt=""></button>';
    }).join("");
  } else {
    stack.querySelectorAll(".hero").forEach(function (img, idx) {
      img.classList.toggle("on", idx === p);
    });
    document.querySelectorAll("#thumbs button").forEach(function (btn, idx) {
      btn.classList.toggle("on", idx === p);
    });
  }
}

function openIg(c) {
  document.getElementById("igOpen").href = c.ig;
  document.getElementById("igFrame").src = "https://www.instagram.com/" + c.igUser + "/embed/";
  document.getElementById("igPop").classList.add("on");
}

document.getElementById("strip").innerHTML = clubs.map(function (c, idx) {
  return '<button class="chip' + (idx === 0 ? " on" : "") + '" type="button" data-i="' + idx + '">' +
    '<img src="' + thumbPhoto(c.photos[0]) + '" alt="">' +
    "<span>" + c.rank + " " + c.name + "<small>" + c.drive + ", spend " + c.spend + "</small></span></button>";
}).join("");

document.getElementById("strip").addEventListener("click", function (e) {
  const b = e.target.closest(".chip");
  if (b) show(+b.dataset.i);
});
document.getElementById("thumbs").addEventListener("click", function (e) {
  const b = e.target.closest("button");
  if (b) paintPhotos(clubs[i], +b.dataset.p);
});
document.getElementById("prev").onclick = function () { show(i - 1); };
document.getElementById("next").onclick = function () { show(i + 1); };
document.getElementById("igClose").onclick = function () {
  document.getElementById("igPop").classList.remove("on");
  document.getElementById("igFrame").src = "";
};
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") document.getElementById("igClose").click();
  if (e.key === "ArrowRight") show(i + 1);
  if (e.key === "ArrowLeft") show(i - 1);
});

(function boot() {
  const q = new URLSearchParams(location.search).get("club");
  const fromQuery = q ? clubs.findIndex(function (c) { return c.id === q; }) : -1;
  const fromHash = clubs.findIndex(function (c) { return "#" + c.id === location.hash; });
  const start = fromQuery >= 0 ? fromQuery : (fromHash >= 0 ? fromHash : 0);
  initMap();
  show(start);
  clubs.forEach(function (c) {
    preloadClub(c);
    loadRoute(c).then(function () {
      if (clubs[i].id === c.id) updateMap(c);
    });
  });
})();
